services:
  # ──────────────────────────────────────────────────────────
  # База данных ланчей
  # ──────────────────────────────────────────────────────────
  lunch_db:
    image: mysql:8.0-oraclelinux8
    container_name: cb_lunchservice_db
    restart: unless-stopped
    ports:
      - "3306"
    environment:
      - MYSQL_DATABASE=lunch_service
      - MYSQL_USER=lunch_user
      - MYSQL_PASSWORD
      - MYSQL_ROOT_PASSWORD
      - MYSQL_ROOT_HOST=%
      - TZ=Europe/Moscow
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-redo-log-capacity=128M
      - --max-connections=50
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --thread-cache-size=8
      - --table-open-cache=400
      - --skip-name-resolve
    volumes:
      - ./data/lunch-service/mysql:/var/lib/mysql
      - ./logs/lunch-service/mysql:/var/log/mysql
    networks:
      - cb-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-password"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ──────────────────────────────────────────────────────────
  # Lunch Service
  # ──────────────────────────────────────────────────────────
  lunch-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cb_lunchservice_svc
    image: lunch-service:1.0.0
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      lunch_db:
        condition: service_healthy
    env_file:
      - ./
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - SERVER_SSL_ENABLED=false
      - DB_HOST=lunch_db
      - DB_PORT=3306
      - DB_NAME=lunch_service
      - DB_USERNAME
      - DB_PASSWORD
      - NOTIFICATION_SERVICE_URL=http://notification:8082
      - FOOD_SERVICE_URL=http://food-service:8086
      - TZ=Europe/Moscow
    mem_limit: 1g
    networks:
      - cb-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cb-network:
    driver: bridge
