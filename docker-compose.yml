name: lunchservice

services:
  # ==================== MySQL ====================
  lunchservice_db:
    image: mysql:8.0-oraclelinux8
    container_name: cb_lunchservice_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=lunch_service
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_ROOT_HOST=%
      - TZ=Europe/Moscow
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-redo-log-capacity=128M
      - --max-connections=50
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --thread-cache-size=8
      - --table-open-cache=400
      - --skip-name-resolve
    volumes:
      - ./data/lunchservice/mysql:/var/lib/mysql
      - ./logs/lunchservice/mysql:/var/log/mysql
    networks:
      - cb-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==================== Lunch Service ====================
  lunch-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cb_lunchservice_svc
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      lunchservice_db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8085
      - SERVER_SSL_ENABLED=false
      - SPRING_DATASOURCE_URL=jdbc:mysql://lunchservice_db:3306/lunch_service?serverTimezone=Europe/Moscow&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - TZ=Europe/Moscow
    mem_limit: 1g
    networks:
      - cb-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lunchservice_mysql_data:
    driver: local

networks:
  cb-network:
    driver: bridge
