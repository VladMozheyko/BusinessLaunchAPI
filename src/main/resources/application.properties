spring.application.name=LunchService
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ========================================
# Подключение к базе данных
# ========================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Europe/Moscow&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# Кодировка
# ========================================
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# ========================================
# Дефолтный глобальный администратор
# ========================================
app.admin.bootstrap-email=${APP_AUTH_GLOBAL_ADMIN_DEFAULT_EMAIL}

# ========================================
# Настройки Hibernate и JPA
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ========================================
# JWT Configuration
# ========================================
security.jwt.header=Authorization
security.jwt.prefix=Bearer
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.bar-auth-secret-key=${JWT_BAR_AUTH_SECRET_KEY}

# ========================================
# Notification Service Configuration
# ========================================
notification.service.url=${NOTIFICATION_SERVICE_URL}
notification.internal.service.key=${NOTIFICATION_INTERNAL_SERVICE_KEY}

# ========================================
# Food Service Configuration
# ========================================
food.service.url=${FOOD_SERVICE_URL}
food.service.path=/api/v1/food

# ========================================
# Feign Client timeouts
# ========================================
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000

# ========================================
# Swagger / OpenAPI
# ========================================
springdoc.swagger-ui.docExpansion=none

# ========================================
# Spring Boot Actuator
# ========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
