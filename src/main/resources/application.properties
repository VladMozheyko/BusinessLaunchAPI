spring.application.name=LunchService
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ==================== Swagger/OpenAPI ====================
# docExpansion: none ? ??? ????????, list ? ?????? ???? ??????????, full ? ??? ??????????
springdoc.swagger-ui.docExpansion=none
# ?????????????? ????????? UTF-8 ??? ???? HTTP-???????? ? ???????
spring.http.encoding=UTF-8
spring.mvc.output.encoding=UTF-8
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# ==================== Timezone ====================
# ????? ? ?? ???????? ? UTC, ??????????? ? ? ??????
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=Europe/Moscow
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ==================== JPA / Hibernate ====================
# ?????????????? ??????????? CamelCase ? underscores (myVenueId -> my_venue_id)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8085

# ==================== Security JWT ====================
# ????????? ??? JWT ??????
security.jwt.header=Authorization
# ??????? ??? JWT ??????
security.jwt.prefix=Bearer
# Secret key ??? ????????? JWT ??????? ?? Auth-??????? (???????? ????????????)
security.jwt.secret-key=${JWT_SECRET_KEY:change-me-in-production}
# Secret key ??? ????????? JWT ??????? ?? Bar Auth-??????? (????????? ?????/?????????)
security.jwt.bar-auth-secret-key=${JWT_BAR_AUTH_SECRET_KEY:change-me-in-production}

# ==================== Feign timeouts ====================
# ???????? ??? HTTP-??????? ????? Feign Client
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000

# ==================== Notification Service URL ====================
# URL Notification Service ??? ???????? push/email ???????????
notification.service.url=http://localhost:8082

# ==================== Notification Service API Key ====================
# API Key ??? ?????????????? ? Notification Service
# Notification Service ????????? ????????? X-Internal-Service-Key
notification.internal.service.key=${NOTIFICATION_INTERNAL_SERVICE_KEY:internal-secret-key-2024}

# ==================== Food Service URL ====================
# URL ??? ??????????? ? Food Service (???????? ???????)
# ???????????? ??? ????????????? ?????????, ???? ? ?????????
food.service.url=${FOOD_SERVICE_URL:http://localhost:8086}
food.service.path=/api/v1/food
