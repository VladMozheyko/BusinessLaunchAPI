# ========================================
# DataSource (Prod)
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3307/lunch_service

# ========================================
# Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update

# ========================================
# API Server
# ========================================
api.server.url=${PROD_API_SERVER_URL}

# ========================================
# Notification Service
# ========================================
notification.service.url=${PROD_NOTIFICATION_SERVICE_URL}

# ========================================
# Food Service
# ========================================
food.service.url=${PROD_FOOD_SERVICE_URL}

# ========================================
# Venue Service
# ========================================
app.venue.check-enabled=true
venue.service.url=${PROD_VENUE_SERVICE_URL}
venue.service.path=/api/v1/venues

# ========================================
# CORS
# ========================================
app.cors.allowed-origins=${PROD_CORS_ALLOWED_ORIGINS}

# ========================================
# Database
# ========================================
DB_HOST=${PROD_DB_HOST}
DB_PORT=${PROD_DB_PORT}
DB_NAME=${PROD_DB_NAME}
DB_USERNAME=${PROD_DB_USERNAME}
DB_PASSWORD=${PROD_DB_PASSWORD}

# ========================================
# Services
# ========================================
NOTIFICATION_SERVICE_URL=${PROD_NOTIFICATION_SERVICE_URL}
FOOD_SERVICE_URL=${PROD_FOOD_SERVICE_URL}
NOTIFICATION_INTERNAL_SERVICE_KEY=${PROD_NOTIFICATION_INTERNAL_SERVICE_KEY}

# ========================================
# Auth
# ========================================
APP_AUTH_GLOBAL_ADMIN_DEFAULT_EMAIL=${PROD_APP_AUTH_GLOBAL_ADMIN_DEFAULT_EMAIL}
JWT_SECRET_KEY=${PROD_JWT_SECRET_KEY}
JWT_BAR_AUTH_SECRET_KEY=${PROD_JWT_BAR_AUTH_SECRET_KEY}
