# ==================== DataSource (Prod) ====================
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}

# ==================== Hibernate ====================
spring.jpa.hibernate.ddl-auto=${PROD_SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# ==================== API Server ====================
api.server.url=${PROD_API_SERVER_URL}

# ==================== Venue Service ====================
app.venue.check-enabled=true
venue.service.name=${PROD_VENUE_SERVICE_NAME:venue-service}
venue.service.path=${PROD_VENUE_SERVICE_PATH:/api/v1/venues}
venue.service.url=${PROD_VENUE_SERVICE_URL}

# ==================== CORS ====================
app.cors.allowed-origins=${PROD_CORS_ALLOWED_ORIGINS}

# ==================== Auth Bootstrap ====================
app.admin.bootstrap-email=${PROD_APP_AUTH_GLOBAL_ADMIN_DEFAULT_EMAIL}

# ==================== JWT ====================
security.jwt.secret-key=${PROD_SECURITY_JWT_SECRET_KEY}
