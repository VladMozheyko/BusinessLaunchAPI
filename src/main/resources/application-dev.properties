# ========================================
# DataSource (Dev)
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3307/lunch_service

# ========================================
# Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update

# ========================================
# API Server
# ========================================
api.server.url=http://localhost:8085

# ========================================
# Notification Service
# ========================================
notification.service.url=http://localhost:8082

# ========================================
# Food Service
# ========================================
food.service.url=http://localhost:8086

# ========================================
# Venue Service
# ========================================
app.venue.check-enabled=false
venue.service.url=http://localhost:8081
venue.service.path=/api/v1/venues

# ========================================
# CORS
# ========================================
app.cors.allowed-origins=http://localhost:8080

# ========================================
# Database
# ========================================
DB_HOST=${DEV_DB_HOST}
DB_PORT=${DEV_DB_PORT}
DB_NAME=${DEV_DB_NAME}
DB_USERNAME=${DEV_DB_USERNAME}
DB_PASSWORD=${DEV_DB_PASSWORD}

# ========================================
# Services
# ========================================
NOTIFICATION_SERVICE_URL=${DEV_NOTIFICATION_SERVICE_URL}
FOOD_SERVICE_URL=${DEV_FOOD_SERVICE_URL}
NOTIFICATION_INTERNAL_SERVICE_KEY=${DEV_NOTIFICATION_INTERNAL_SERVICE_KEY}

# ========================================
# Auth
# ========================================
APP_AUTH_GLOBAL_ADMIN_DEFAULT_EMAIL=${DEV_APP_AUTH_GLOBAL_ADMIN_DEFAULT_EMAIL}
JWT_SECRET_KEY=${DEV_JWT_SECRET_KEY}
JWT_BAR_AUTH_SECRET_KEY=${DEV_JWT_BAR_AUTH_SECRET_KEY}
