# ========================================
# DataSource (Dev)
# ========================================
SPRING_PROFILES_ACTIVE=dev

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Europe/Moscow&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ========================================
# API Server (Dev)
# ========================================
api.base-url=${API_BASE_URL:https://dev.center.beer}

# ========================================
# Notification Service (Dev)
# ========================================
notification.service.url=${NOTIFICATION_SERVICE_URL:http://notification:8082}
notification.internal.service.key=${NOTIFICATION_INTERNAL_SERVICE_KEY}

# ========================================
# Food Service (Dev)
# ========================================
food.service.url=${FOOD_SERVICE_URL:http://localhost:8086}

# ========================================
# Venue Service (Dev)
# ========================================
app.venue.check-enabled=false
venue.service.url=${VENUE_SERVICE_URL:http://localhost:8081}
venue.service.path=/api/v1/venues

# ========================================
# CORS (Dev)
# ========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# ========================================
# JWT (Dev)
# ========================================
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.bar-auth-secret-key=${JWT_BAR_AUTH_SECRET_KEY}
