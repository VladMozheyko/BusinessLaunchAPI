# ==================== DataSource (Dev) ====================
spring.datasource.url=${DEV_DB_URL}
spring.datasource.username=${DEV_DB_USERNAME}
spring.datasource.password=${DEV_DB_PASSWORD}

# ==================== Hibernate ====================
spring.jpa.hibernate.ddl-auto=${DEV_SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# ==================== API Server ====================
api.server.url=${DEV_API_SERVER_URL:http://localhost:8080}

# ==================== Venue Service ====================
app.venue.check-enabled=false
venue.service.name=${DEV_VENUE_SERVICE_NAME:venue-service}
venue.service.path=${DEV_VENUE_SERVICE_PATH:/api/v1/venues}
venue.service.url=${DEV_VENUE_SERVICE_URL:http://localhost:8081}

# ==================== CORS ====================
app.cors.allowed-origins=${DEV_CORS_ALLOWED_ORIGINS:http://localhost:8080}

# ==================== Auth Bootstrap ====================
app.admin.bootstrap-email=${DEV_APP_AUTH_GLOBAL_ADMIN_DEFAULT_EMAIL}

# ==================== JWT ====================
security.jwt.secret-key=${DEV_SECURITY_JWT_SECRET_KEY}
