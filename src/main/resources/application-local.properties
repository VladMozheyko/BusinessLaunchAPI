# ========================================
# DataSource (Local) — переопределение
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3307/lunch_service
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# Encoding (Local)
# ========================================
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# ========================================
# Hibernate (Local)
# ========================================
spring.jpa.hibernate.ddl-auto=create

# ========================================
# API Server (Local)
# ========================================
api.base-url=http://localhost:8085

# ========================================
# Notification Service (Local)
# ========================================
notification.service.url=http://localhost:8082
notification.internal.service.key=${NOTIFICATION_INTERNAL_SERVICE_KEY}


# ========================================
# Food Service (Local)
# ========================================
food.service.url=http://localhost:8086

# ========================================
# Venue Service (Local)
# ========================================
app.venue.check-enabled=false
venue.service.url=http://localhost:8081
venue.service.path=/api/v1/venues

# ========================================
# CORS (Local)
# ========================================
app.cors.allowed-origins=http://localhost:8080

# ========================================
# JWT (Local)
# ========================================
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.bar-auth-secret-key=${JWT_BAR_AUTH_SECRET_KEY}
