# ========================================
# DataSource (Local)
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3307/lunch_service
spring.datasource.username=root
spring.datasource.password=root

# ========================================
# Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=create

# ========================================
# API Server
# ========================================
api.server.url=http://localhost:8085

# ========================================
# Notification Service
# ========================================
notification.service.url=http://localhost:8082

# ========================================
# Food Service
# ========================================
food.service.url=http://localhost:8086

# ========================================
# Venue Service
# ========================================
app.venue.check-enabled=false
venue.service.url=http://localhost:8081
venue.service.path=/api/v1/venues

# ========================================
# CORS
# ========================================
app.cors.allowed-origins=http://localhost:8080

# ========================================
# JWT
# ========================================
security.jwt.secret-key=local-jwt-secret-key-change-in-production
security.jwt.bar-auth-secret-key=local-bar-auth-secret-key-change-in-production

# ========================================
# Database
# ========================================
DB_HOST=localhost
DB_PORT=3307
DB_NAME=lunch_service
DB_USERNAME=root
DB_PASSWORD=root

# ========================================
# Services
# ========================================
NOTIFICATION_SERVICE_URL=http://localhost:8082
FOOD_SERVICE_URL=http://localhost:8086
NOTIFICATION_INTERNAL_SERVICE_KEY=local-internal-service-key

# ========================================
# Auth
# ========================================
APP_AUTH_GLOBAL_ADMIN_DEFAULT_EMAIL=admin@company.com
JWT_SECRET_KEY=local-jwt-secret-key-change-in-production
JWT_BAR_AUTH_SECRET_KEY=local-bar-auth-secret-key-change-in-production
