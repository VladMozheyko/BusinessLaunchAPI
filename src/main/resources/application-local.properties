# ==================== DataSource (Local) ====================
spring.datasource.url=${LOCAL_DB_URL}
spring.datasource.username=${LOCAL_DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}

# ==================== Hibernate ====================
spring.jpa.hibernate.ddl-auto=${LOCAL_SPRING_JPA_HIBERNATE_DDL_AUTO:create}

# ==================== API Server ====================
api.server.url=${LOCAL_API_SERVER_URL:http://localhost:8080}

# ==================== Venue Service ====================
app.venue.check-enabled=false
venue.service.name=${LOCAL_VENUE_SERVICE_NAME:venue-service}
venue.service.path=${LOCAL_VENUE_SERVICE_PATH:/api/v1/venues}
venue.service.url=${LOCAL_VENUE_SERVICE_URL:http://localhost:8081}

# ==================== CORS ====================
app.cors.allowed-origins=${LOCAL_CORS_ALLOWED_ORIGINS:http://localhost:8080}

# ==================== Auth Bootstrap ====================
app.admin.bootstrap-email=${LOCAL_APP_AUTH_GLOBAL_ADMIN_DEFAULT_EMAIL}

# ==================== JWT ====================
security.jwt.secret-key=${LOCAL_SECURITY_JWT_SECRET_KEY}
